# Manifold deploy compose —— sub2api 网关 + devin2api 上游 + chat-demo + 数据/监控/反代
#
# 设计原则：
#   - sub2api / devin2api 用固定 digest 镜像（升级流程见 docs/upgrade.md）
#   - chat-demo 从 ../chat-demo 本地构建（聊天 + 生图）
#   - 所有持久化数据集中在 ./data/ 下，便于备份和迁移
#
# 启动：
#   cd deploy
#   cp .env.example .env  &&  编辑 .env 设置 POSTGRES_PASSWORD / JWT_SECRET / TOTP_ENCRYPTION_KEY
#   docker compose up -d

name: manifold

services:

  # ─── 数据层 ────────────────────────────────────────────────
  # 镜像版本固定到 digest —— 升级流程：先在 staging 改 digest 跑通，再到 prod 改。
  # 别用 :latest 或滚动的 :alpine，否则 docker compose up 可能拉到 breaking change 直接挂。
  postgres:
    # PostgreSQL 17.11 (security update 2026-10-26)
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: manifold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - manifold-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Redis 8.6.7 (security update 2026-10-26)
    image: redis@sha256:7033ad495c19b6bca38aea38f9130d1a3d5b647ac94f3ebe644c8c0fb804e039
    container_name: manifold-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--maxclients", "50000", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      - manifold-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 前台网关：sub2api（后续替换为 Manifold 重构镜像） ──────
  sub2api:
    # sub2api 0.2.18 (pulled 2026-10-26)
    image: weishaw/sub2api@sha256:468a0b0e541e4becc05f1cf57826159235ea27a49a09f3dc2da6a43fcc05a22d
    container_name: manifold-sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      TZ: ${TZ:-Asia/Shanghai}
      # 出网：本机在洛杉矶，OpenAI/Anthropic/Google 均可直连，无需出网代理。
      # （旧香港机曾在此设 host:7890 clash 代理；迁美后移除，避免连不存在的代理导致出网失败。
      #  这样本 compose 不再依赖 docker-compose.override.yml 关代理，可直接部署。）
      # 数据库
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_NAME: ${POSTGRES_DB:-sub2api}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # 鉴权固定值 —— 不设置则每次重启用户登录态/2FA 失效
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required, run scripts/init.ps1}"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required, run scripts/init.ps1}"

      # 管理员账号
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required in .env}

      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # 不再 publish host port —— 全走内置 Caddy 反代（见下方 caddy service）。
    # 如需临时本机调试 sub2api 后台，临时反注释下面这行：
    #   ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./data/sub2api:/app/data
    networks:
      - manifold-data       # 用于触达 postgres / redis
      - manifold-upstream   # 用于出网调厂商 API
      - manifold-edge       # 用于被 caddy 反代
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Devin 上游适配：devin2api（作为 sub2api 的一个上游账号） ──
  # 把 Devin 账号的模型转成 Anthropic Messages / OpenAI Responses / Chat 协议。
  # sub2api 后台建 API Key 账号接入：base_url = http://devin2api:8080，
  # api_key = devin2api 面板 /web/tokens.html 创建的下游令牌。
  # 不接 manifold-edge、不经 Caddy 对外；面板只绑本机端口，远端走 SSH 隧道：
  #   ssh -L 3033:127.0.0.1:3033 vps，然后本机浏览器开 http://127.0.0.1:3033/web
  # 首次启动前先跑 scripts/init.sh 生成 ./devin2api/config.yaml（含面板密码）。
  # 上线、接入、升级步骤见 docs/runbook.md「devin2api 上线与接入 sub2api」。
  devin2api:
    # 官方镜像（digest 钉在 ./devin2api/Dockerfile）二进制缺执行位，本地补一层再用
    build:
      context: ./devin2api
    # devin2api 0.18.0 (pulled 2026-10-27)
    image: manifold/devin2api:0.18.0
    container_name: manifold-devin2api
    restart: unless-stopped
    # 收到 SIGTERM 后进程最多排空 600s 让在途流跑完；不放宽的话 docker 10s 就强杀。
    stop_grace_period: 660s
    security_opt:
      - no-new-privileges:true
    command: ["-config", "/app/config.yaml", "-state-dir", "/app/state"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 仅本机绑定 —— 管理面板 /web 和调试用；sub2api 走容器内网访问
      - "127.0.0.1:3033:8080"
    volumes:
      - ./devin2api/config.yaml:/app/config.yaml:ro
      # SQLite 状态库：Devin 账号凭据、下游令牌、请求日志、限流闩状态
      - ./data/devin2api:/app/state
    networks:
      - manifold-upstream   # 出网连 Devin 上游；sub2api 也在这个网络里访问它
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── 外层反向代理：Caddy（仅它对外暴露 80/443） ────────────
  # 域名由 .env 的 SITE_DOMAINS / CHAT_DOMAINS / BLOG_DOMAINS 控制。
  # 使用 scripts/update-domains.sh 更新；环境变量变化需要重建 Caddy 容器。
  caddy:
    build:
      context: ./caddy
    # Caddy 2.11.7 rebuilt with Go 1.27.3
    image: manifold/caddy:security-20261026
    container_name: manifold-caddy
    restart: unless-stopped
    depends_on:
      sub2api:
        condition: service_healthy
    environment:
      SITE_DOMAINS: "${SITE_DOMAINS:-zstuacm.xyz, www.zstuacm.xyz, zstu.asia, www.zstu.asia}"
      CHAT_DOMAINS: "${CHAT_DOMAINS:-chat.zstuacm.xyz, chat.zstu.asia}"
      BLOG_DOMAINS: "${BLOG_DOMAINS:-blog.zstuacm.xyz, blog.zstu.asia}"
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required in .env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "80:80"
      - "443:443"
      # Cloudflare 对源站使用 TCP；不发布 UDP/443，减少可绕过代理的入口。
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./brand:/srv/brand:ro             # 品牌静态资源兜底，如 /manifold.svg
      - ./data/caddy/data:/data           # ACME 证书持久化（不丢就不会每次重启重签 → 触发 LE rate limit）
      - ./data/caddy/config:/config
    networks:
      - manifold-edge

  # ─── 监控：Uptime Kuma ─────────────────────────────────────
  # 自托管探针 + 告警面板。访问方式（默认）：
  #   本机：浏览器开 http://127.0.0.1:3001
  #   远端：ssh -L 3001:127.0.0.1:3001 vps，然后本机浏览器开 http://127.0.0.1:3001
  # 首次启动后必须立刻设管理员账号；具体配什么探针看 docs/monitoring.md
  kuma:
    # Uptime Kuma 2.5.7 (Node 22.23.4)
    image: louislam/uptime-kuma@sha256:4b95dbe7ac5343b768f8e04e3035ccd59997872b1a35ab9b0f082d2cc279070e
    container_name: manifold-kuma
    restart: unless-stopped
    ports:
      # 仅本机绑定 —— 远端用 SSH 隧道访问，UI 不需要也不应该公网暴露
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      # 三个网络都接：data 跨 postgres/redis 探针，upstream 走 Telegram 告警出网，edge 备用
      - manifold-data
      - manifold-upstream
      - manifold-edge

  # ─── 出网 ──────────────────────────────────────────────────
  # 本机可直连 OpenAI/Anthropic/Google，无需出网代理。
  # sub2api 经 manifold-upstream 网络直接出网调厂商 API。

  # ─── 个人博客（源码在 ../blog） ────────────────────────────
  blog:
    build:
      context: ../blog
    image: manifold/blog:security-20261026
    container_name: manifold-blog
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      VINEXT_TRUSTED_HOSTS: "${BLOG_TRUSTED_HOSTS:-blog.zstuacm.xyz,blog.zstu.asia}"
      BLOG_SITE_URL: "${BLOG_SITE_URL:-https://blog.zstuacm.xyz}"
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - manifold-edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── chat-demo（从旧机迁移恢复，源码在 ../chat-demo） ──────────
  chat-demo:
    build:
      context: ../chat-demo
    image: manifold/chat-demo:security-20261026
    container_name: manifold-chat-demo
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      SUB2API_BASE: http://manifold-sub2api:8080
      # 豆包生图：chat-demo 直连火山方舟出图，计费回扣到用户的 sub2api 余额（见 server.ts apiImages）
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE: ${ARK_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      SUB2API_ADMIN_KEY: ${SUB2API_ADMIN_KEY:-}
      # 豆包每模型单价（USD/张；火山按模型×张数计费，与分辨率无关）。缺省即代码内置默认。
      DOUBAO_PRICE_4_0: ${DOUBAO_PRICE_4_0:-0.20}
      DOUBAO_PRICE_5_0_LITE: ${DOUBAO_PRICE_5_0_LITE:-0.22}
      DOUBAO_PRICE_4_5: ${DOUBAO_PRICE_4_5:-0.25}
      DOUBAO_PRICE_USD: ${DOUBAO_PRICE_USD:-0.10}
      PORT: "8787"
      DB_PATH: /data/manifold.db
      NODE_OPTIONS: --no-warnings
      LEGACY_PROXY: "off"
      LEGACY_STORE: "off"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - chat-data:/data
    networks:
      - manifold-edge

networks:
  # 数据层：postgres / redis / sub2api。internal=true 让数据库容器自己上不了外网
  manifold-data:
    name: manifold-data
    driver: bridge
    internal: true
  # 上游层：sub2api / devin2api 出网调厂商 API，因此不设 internal；
  # sub2api → devin2api 的内网调用也走这里
  manifold-upstream:
    name: manifold-upstream
    driver: bridge
  # 边缘层：caddy ↔ sub2api。把外网入口和数据层隔开
  manifold-edge:
    name: manifold-edge
    driver: bridge

volumes:
  chat-data:
    name: manifold-chat-data
