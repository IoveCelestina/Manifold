# Manifold deploy compose —— sub2api 网关 + chat-demo + 数据/监控/反代
#
# 设计原则：
#   - sub2api 用固定 digest 镜像（升级流程见 docs/upgrade.md）
#   - chat-demo 从 ../chat-demo 本地构建（聊天 + 生图）
#   - 所有持久化数据集中在 ./data/ 下，便于备份和迁移
#
# 启动：
#   cd deploy
#   cp .env.example .env  &&  编辑 .env 设置 POSTGRES_PASSWORD / JWT_SECRET / TOTP_ENCRYPTION_KEY
#   docker compose up -d

name: manifold

services:

  # ─── 数据层 ────────────────────────────────────────────────
  # 镜像版本固定到 digest —— 升级流程：先在 staging 改 digest 跑通，再到 prod 改。
  # 别用 :latest 或滚动的 :alpine，否则 docker compose up 可能拉到 breaking change 直接挂。
  postgres:
    # postgres:17-alpine  (pulled 2026-05-20)
    image: postgres@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    container_name: manifold-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - manifold-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # redis:8-alpine  (pulled 2026-05-20)
    image: redis@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
    container_name: manifold-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--maxclients", "50000", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      - manifold-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 前台网关：sub2api（后续替换为 Manifold 重构镜像） ──────
  sub2api:
    # sub2api 0.1.141 (commit 7cb98e5b, built 2026-06-30)
    image: weishaw/sub2api@sha256:f242f8504c9cb3c89f2a9531b1491a83d9bc7f3648a649c2c3082820d40f64cd
    container_name: manifold-sub2api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      TZ: ${TZ:-Asia/Shanghai}
      # 出网：本机在洛杉矶，OpenAI/Anthropic/Google 均可直连，无需出网代理。
      # （旧香港机曾在此设 host:7890 clash 代理；迁美后移除，避免连不存在的代理导致出网失败。
      #  这样本 compose 不再依赖 docker-compose.override.yml 关代理，可直接部署。）
      # 数据库
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_NAME: ${POSTGRES_DB:-sub2api}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # 鉴权固定值 —— 不设置则每次重启用户登录态/2FA 失效
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required, run scripts/init.ps1}"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required, run scripts/init.ps1}"

      # 管理员账号
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@manifold.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # 不再 publish host port —— 全走内置 Caddy 反代（见下方 caddy service）。
    # 如需临时本机调试 sub2api 后台，临时反注释下面这行：
    #   ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./data/sub2api:/app/data
    networks:
      - manifold-data       # 用于触达 postgres / redis
      - manifold-upstream   # 用于出网调厂商 API
      - manifold-edge       # 用于被 caddy 反代
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── 外层反向代理：Caddy（仅它对外暴露 80/443） ────────────
  # 模式由 .env 里的 DOMAIN 切：
  #   DOMAIN=空                → 只听 :80，IP 直连（联调/内测用，无 HTTPS）
  #   DOMAIN=manifold.example  → 自动 Let's Encrypt 签证书 + 80 跳 443
  # 改 Caddyfile 后不停服：docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
  caddy:
    # caddy:2.11-alpine  (pulled 2026-05-20)
    image: caddy@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    container_name: manifold-caddy
    restart: unless-stopped
    depends_on:
      sub2api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-Taohu0122@qq.com}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./brand:/srv/brand:ro             # 品牌静态资源兜底，如 /manifold.svg
      - ./data/caddy/data:/data           # ACME 证书持久化（不丢就不会每次重启重签 → 触发 LE rate limit）
      - ./data/caddy/config:/config
    networks:
      - manifold-edge

  # ─── 监控：Uptime Kuma ─────────────────────────────────────
  # 自托管探针 + 告警面板。访问方式（默认）：
  #   本机：浏览器开 http://127.0.0.1:3001
  #   远端：ssh -L 3001:127.0.0.1:3001 vps，然后本机浏览器开 http://127.0.0.1:3001
  # 首次启动后必须立刻设管理员账号；具体配什么探针看 docs/monitoring.md
  kuma:
    # uptime-kuma 2.3.2  (pulled 2026-05-20)
    image: louislam/uptime-kuma@sha256:9aeb4e51d038047f414309c77a1af553281ca535723cb88907d907269d0a908e
    container_name: manifold-kuma
    restart: unless-stopped
    ports:
      # 仅本机绑定 —— 远端用 SSH 隧道访问，UI 不需要也不应该公网暴露
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      # 三个网络都接：data 跨 postgres/redis 探针，upstream 走 Telegram 告警出网，edge 备用
      - manifold-data
      - manifold-upstream
      - manifold-edge

  # ─── 出网 ──────────────────────────────────────────────────
  # 本机可直连 OpenAI/Anthropic/Google，无需出网代理。
  # sub2api 经 manifold-upstream 网络直接出网调厂商 API。

  # ─── chat-demo（从旧机迁移恢复，源码在 ../chat-demo） ──────────
  chat-demo:
    build:
      context: ../chat-demo
    image: manifold/chat-demo:local
    container_name: manifold-chat-demo
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      SUB2API_BASE: http://manifold-sub2api:8080
      PORT: "8787"
      DB_PATH: /data/manifold.db
      NODE_OPTIONS: --no-warnings
      LEGACY_PROXY: "off"
      LEGACY_STORE: "off"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - chat-data:/data
    networks:
      - manifold-edge

networks:
  # 数据层：postgres / redis / sub2api。internal=true 让数据库容器自己上不了外网
  manifold-data:
    name: manifold-data
    driver: bridge
    internal: true
  # 上游层：sub2api 出网调厂商 API，因此不设 internal
  manifold-upstream:
    name: manifold-upstream
    driver: bridge
  # 边缘层：caddy ↔ sub2api。把外网入口和数据层隔开
  manifold-edge:
    name: manifold-edge
    driver: bridge

volumes:
  chat-data:
    name: manifold-chat-data
