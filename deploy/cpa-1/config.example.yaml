# CPA #1 配置模板
# 用法：cp config.example.yaml config.yaml  并填好下面的 INTERNAL_SHARED_SECRET
#       （Manifold/scripts/init.ps1 会自动生成）
#
# 此实例承载一个 OAuth 订阅账号。本机首次启动后需进入容器跑登录命令：
#   docker compose exec cpa-1 ./CLIProxyAPI login --provider claude
# 登录后 token 落在挂载卷 ./cpa-1/auths/ 下，下次重启自动复用。

host: "0.0.0.0"
port: 8317

# 这把 key 是 sub2api 调 CPA 时的共享秘钥，不是给终端用户的。
# 在 sub2api 后台添加 "OpenAI 兼容上游账号" 时填同一个值。
api-keys:
  - "REPLACE_WITH_INTERNAL_SHARED_SECRET_1"

# OAuth token 持久化目录（容器内绝对路径，已通过 volume 挂载到 ./cpa-1/auths/）
auth-dir: "/root/.cli-proxy-api"

# 商业模式：跳过高开销中间件以提升吞吐
commercial-mode: true

# 远程管理 API（默认关闭，仅本机操作）
remote-management:
  allow-remote: false
  disable-control-panel: true
